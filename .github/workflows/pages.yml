name: Publish site to gh-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html 404.html manifest.webmanifest sw.js robots.txt .nojekyll _site/
          cp icon.svg icon-192x192.png icon-512x512.png _site/
          cp -R shared Services _site/
          echo 'lmbi.ru' > _site/CNAME

      # Публикация обычным git push в ветку gh-pages: не зависит от
      # Pages deployment API, который отвечает 500 (actions/deploy-pages).
      - name: Publish to gh-pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cd _site
          git init -q
          git checkout -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "deploy ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
